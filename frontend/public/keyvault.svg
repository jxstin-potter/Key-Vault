<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Favicon version of the brand mark. Unlike the in-app <Logo />, this one
       sits on the dark brand plate: browser tab bars are often light, and the
       neon gradient has almost no contrast against white on its own. Geometry
       is kept in sync with src/components/Logo.jsx. -->
  <defs>
    <linearGradient id="kv-favicon-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#66c0f4"/>
      <stop offset="100%" stop-color="#3bb6d0"/>
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#171a21"/>

  <g transform="translate(3.5, 3.1) scale(0.78)">
    <path
      fill-rule="evenodd"
      fill="url(#kv-favicon-gradient)"
      d="M 10 3 H 22 A 6 6 0 0 1 28 9 V 11 A 6 6 0 0 1 22 17 H 10 A 6 6 0 0 1 4 11 V 9 A 6 6 0 0 1 10 3 Z
         M 14.7 6.4 H 17.3 V 8.7 H 19.6 V 11.3 H 17.3 V 13.6 H 14.7 V 11.3 H 12.4 V 8.7 H 14.7 Z"
    />
    <path
      fill="url(#kv-favicon-gradient)"
      d="M 13.8 17 H 18.2 V 20.5 H 23 V 23 H 18.2 V 25.5 H 21.5 V 28 H 18.2 V 30 H 13.8 Z"
    />
  </g>
</svg>
